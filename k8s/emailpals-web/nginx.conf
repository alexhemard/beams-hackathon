# emailpals-web: static site + /api/ proxied to emailpals-api so the page can poll it.
# Mounted as /etc/nginx/conf.d/default.conf from the emailpals-web-nginx ConfigMap.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # health of the API tier, as seen by the web tier: 200 when emailpals-api answers,
    # 502/504 when its pods are gone (that is the outage the demo alert is about)
    location /api/ {
        proxy_pass http://emailpals-api.emailpals.svc.cluster.local/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_next_upstream off;
        add_header Cache-Control "no-store";
    }
}
