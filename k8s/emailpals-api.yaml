apiVersion: v1
kind: Namespace
metadata:
  name: emailpals
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailpals-api
  namespace: emailpals
spec:
  replicas: 1
  # Recreate so a bad image is a real outage (0 available replicas -> EmailpalsApiUnavailable).
  # With the default RollingUpdate the old pod stays up and the alert never fires.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: emailpals-api }
  template:
    metadata:
      labels: { app: emailpals-api }
    spec:
      containers:
        - name: emailpals-api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 2
