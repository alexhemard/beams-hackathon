# Kubernetes side of the Teleport roles. Teleport maps a Teleport role to
# Kubernetes groups (kubernetes_groups); these bindings decide what those groups
# may do.
#
#   oncall-view    read-only: investigator bot, on-call operator (TUI)
#   administrator  full cluster-admin: per-CR executor bots, and the short-lived
#                  cluster-setup bot demo/lib-teleport-admin.sh mints on demand
#                  for demo/kubeup.sh / break.sh / reset.sh. Neither is ever held
#                  standing. Not namespace-scoped — see terraform/roles.tf for the
#                  trade-off this accepts on a demo cluster.
#
# Applied by the one-time CodeBuild bootstrap (terraform/bootstrap.tf) via its
# EKS access entry (IAM-mediated, no RBAC dependency), before anything else —
# this file is what makes the administrator group (and so every bot that holds
# the administrator Teleport role) mean anything at all.
---
# Read-only, cluster-wide, plus the API server's service proxy so Alertmanager
# can be read with `kubectl get --raw .../services/alertmanager-operated:9093/proxy/...`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oncall-view-extra
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get", "create", "delete"] # get: read alerts; create/delete: post and expire silences
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oncall-view
subjects:
  - kind: Group
    name: oncall-view
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oncall-view-extra
subjects:
  - kind: Group
    name: oncall-view
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: oncall-view-extra
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: administrator
subjects:
  - kind: Group
    name: administrator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
